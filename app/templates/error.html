{% extends "base.html" %}
{% block title %}Error {{ status }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ status }}</h1>
  <p>{{ message }}</p>
  {% if status == 401 %}
    <a class="btn" href="{{ url_for('auth.login') }}">Log in</a>
  {% else %}
    <a class="btn" href="{{ url_for('main.index') }}">Back to home</a>
  {% endif %}
</section>
{% endblock %}
